name: Deploy to Vercel

on:
  push:
    branches: [main]
    # Only deploy when app/runtime files change
    paths:
      - 'src/**'
      - 'public/**'
      - 'api/**'
      - 'vercel.json'
      - 'package.json'
      - 'package-lock.json'
      - '.vercelignore'
  # Allow manual deployments when desired
  workflow_dispatch:

jobs:
  deploy:
    concurrency:
      group: vercel-deploy-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      # Skip full build if only docs or non-app files changed (safety net)
      run: |
        echo "CHANGED_PATHS=$(git diff --name-only ${{ github.sha }} ${{ github.event.before }} | tr '\n' ' ')" >> $GITHUB_ENV
        npm run build
      env:
        REACT_APP_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        REACT_APP_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        REACT_APP_NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        
    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'
        working-directory: ./
      if: ${{ success() }}
