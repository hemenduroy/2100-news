name: Update News Daily

on:
  # schedule disabled to save cost
  # schedule:
  #   - cron: '50 23 * * *'
  #   - cron: '50 11 * * *'
  workflow_dispatch:

jobs:
  update-news:
    name: Update News for Today
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Update news data
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
      run: node scripts/update-news.js

    - name: Generate and upload OG image (square, auto-height)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        DATE_VAL=$(date -u +%F)
        HOUR=$(date -u +%H)
        RUN="1"; if [ "$HOUR" -ge 12 ]; then RUN="2"; fi
        node scripts/generate-og-to-storage.js --ratio=square --daily-run=$RUN --date="$DATE_VAL" | tee og-urls.json

    - name: Tweet latest OG image (square)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        TWITTER_APP_KEY: ${{ secrets.TWITTER_APP_KEY }}
        TWITTER_APP_SECRET: ${{ secrets.TWITTER_APP_SECRET }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
      run: |
        node scripts/tweet-og.js --ratio=square

    - name: Generate and tweet up to 7 single headlines (portrait, auto-height)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        TWITTER_APP_KEY: ${{ secrets.TWITTER_APP_KEY }}
        TWITTER_APP_SECRET: ${{ secrets.TWITTER_APP_SECRET }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
      run: |
        DATE_VAL=$(date -u +%F)
        HOUR=$(date -u +%H)
        RUN="1"; if [ "$HOUR" -ge 12 ]; then RUN="2"; fi
        for i in 0 1 2 3 4 5 6; do
          OUT=$(node scripts/generate-og-to-storage.js --ratio=portrait --date="$DATE_VAL" --daily-run=$RUN --single-index=$i || true)
          echo "$OUT"
          echo "$OUT" | grep -q '"skip": true' && break
          node scripts/tweet-og.js --ratio=portrait --date="$DATE_VAL" --single-index=$i
          sleep 60
        done

    - name: Print OG URLs
      run: |
        cat og-urls.json | sed 's/.*/OG: &/'